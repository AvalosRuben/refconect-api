services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refconect
      POSTGRES_USER: refconect
      POSTGRES_PASSWORD: refconect
    ports:
      # Puerto del host configurable por si 5432 ya está ocupado (DB_PUERTO en .env).
      - "${DB_PUERTO:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético solo cuando el volumen está vacío.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U refconect -d refconect"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  datos_db:
